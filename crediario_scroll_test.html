<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="css/app.css"><style>body{background:#020617}.modal{display:block!important}.modal-backdrop{display:none}</style></head><body class="dark">
<div id="crediarioDetailModal" class="modal fade show crediario-detail-modal" style="display:block" aria-modal="true"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div id="crediarioDetailContent">
<div class="modal-header crediario-detail-header"><div><small>CRD-TESTE</small><h2>GESSICA</h2></div><button class="btn-close"></button></div>
<div class="modal-body p-3 p-md-4"><div class="crediario-detail-summary">${''}</div><div class="crediario-detail-progress mt-3">PROGRESSO</div><div class="crediario-detail-toolbar mt-4"><div><h3>PARCELAS</h3></div><div><button class="btn btn-outline-primary">SELECIONAR VISÍVEIS</button><button class="btn btn-success">QUITAR SELECIONADAS</button><button class="btn btn-outline-success">QUITAR TODAS EM ABERTO</button></div></div><div class="crediario-installment-detail-list mt-3" id="rows"></div></div>
<div class="modal-footer"><strong>SALDO ATUAL</strong><button class="btn btn-secondary">FECHAR</button></div>
</div></div></div></div><pre id="measure"></pre>
<script>
const s=document.querySelector('.crediario-detail-summary');for(let i=0;i<6;i++)s.insertAdjacentHTML('beforeend','<div><span>VALOR</span><strong>R$ 1.700,00</strong></div>');const rows=document.getElementById('rows');for(let i=1;i<=20;i++)rows.insertAdjacentHTML('beforeend',`<div class="crediario-installment-detail"><div class="crediario-installment-check"><input type="checkbox"></div><div class="crediario-installment-number"><strong>${i}</strong><small>/20</small></div><div class="crediario-installment-info"><span class="badge text-bg-primary">EM ABERTO</span><strong>09/09/2026</strong></div><div class="crediario-installment-money crediario-installment-parcela"><small>PARCELA</small><strong>R$ 170,00</strong></div><div class="crediario-installment-money crediario-installment-receber"><small>A RECEBER</small><strong>R$ 170,00</strong></div><div class="crediario-installment-actions"><button class="btn btn-success">RECEBER</button><button class="btn btn-outline-danger">PDF</button><button class="btn btn-outline-warning">EDITAR</button></div></div>`);setTimeout(()=>{const b=document.querySelector('.modal-body'),c=document.querySelector('.modal-content'),d=document.querySelector('.modal-dialog');document.getElementById('measure').textContent=JSON.stringify({vh:innerHeight,dialog:d.getBoundingClientRect().height,content:c.getBoundingClientRect().height,bodyClient:b.clientHeight,bodyScroll:b.scrollHeight,bodyOverflow:getComputedStyle(b).overflowY,horizontal:b.scrollWidth>b.clientWidth},null,2)},100)
</script></body></html>
